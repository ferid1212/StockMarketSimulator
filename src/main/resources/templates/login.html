<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daxil Ol — Stock System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        display: ['"Outfit"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #070a12;
            background-image: 
                radial-gradient(at 10% 20%, rgba(99, 102, 241, 0.22) 0px, transparent 50%),
                radial-gradient(at 90% 10%, rgba(236, 72, 153, 0.2) 0px, transparent 50%),
                radial-gradient(at 50% 90%, rgba(14, 165, 233, 0.18) 0px, transparent 50%);
            background-attachment: fixed;
            color: #f8fafc;
        }

        .glass-box {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 40px -10px rgba(124, 58, 237, 0.2);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-6">
    <div class="w-full max-w-md space-y-6">
        
        <!-- Logo & Branding -->
        <div class="text-center">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-3xl bg-gradient-to-tr from-indigo-600 via-purple-600 to-pink-500 p-0.5 shadow-2xl shadow-indigo-500/30 mb-4 transform hover:rotate-6 transition duration-300">
                <div class="w-full h-full bg-slate-950/80 rounded-[22px] flex items-center justify-center text-indigo-400">
                    <i class="fa-solid fa-boxes-stacked text-2xl"></i>
                </div>
            </div>
            <h1 class="font-display text-3xl font-black tracking-tight bg-gradient-to-r from-indigo-400 via-purple-300 to-pink-400 bg-clip-text text-transparent">Stock System</h1>
            <p class="text-slate-400 text-xs sm:text-sm mt-1.5">Hesabınıza daxil olaraq anbar və sifarişləri idarə edin</p>
        </div>

        <!-- Glass Login Card -->
        <div class="glass-box rounded-3xl p-7 sm:p-9">
            
            <!-- Alert Messages -->
            <div th:if="${param.error}" class="mb-5 p-4 rounded-2xl bg-rose-500/15 border border-rose-500/40 text-rose-300 text-xs flex items-center gap-3">
                <i class="fa-solid fa-circle-exclamation text-base text-rose-400 flex-shrink-0"></i>
                <span>Email və ya şifrə yanlışdır! Zəhmət olmasa yenidən yoxlayın.</span>
            </div>
            <div th:if="${param.logout}" class="mb-5 p-4 rounded-2xl bg-emerald-500/15 border border-emerald-500/40 text-emerald-300 text-xs flex items-center gap-3">
                <i class="fa-solid fa-circle-check text-base text-emerald-400 flex-shrink-0"></i>
                <span>Sistemdən uğurla çıxış etdiniz.</span>
            </div>
            <div th:if="${param.registered}" class="mb-5 p-4 rounded-2xl bg-indigo-500/15 border border-indigo-500/40 text-indigo-300 text-xs flex items-center gap-3">
                <i class="fa-solid fa-circle-check text-base text-indigo-400 flex-shrink-0"></i>
                <span>Qeydiyyat tamamlandı! İndi rahatlıqla daxil ola bilərsiniz.</span>
            </div>

            <!-- Login Form -->
            <form th:action="@{/login}" method="post" class="space-y-4">
                <div>
                    <label class="block text-[11px] font-extrabold uppercase tracking-wider text-slate-400 mb-1.5">Email / Gmail</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400">
                            <i class="fa-regular fa-envelope"></i>
                        </span>
                        <input type="email" id="loginEmail" name="email" required placeholder="admin@gmail.com"
                               class="w-full pl-11 pr-4 py-3 bg-slate-950/70 border border-slate-700/80 rounded-xl focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 text-white placeholder-slate-500 text-sm transition">
                    </div>
                </div>

                <div>
                    <label class="block text-[11px] font-extrabold uppercase tracking-wider text-slate-400 mb-1.5">Şifrə</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400">
                            <i class="fa-solid fa-lock"></i>
                        </span>
                        <input type="password" id="loginPassword" name="password" required placeholder="••••••••"
                               class="w-full pl-11 pr-11 py-3 bg-slate-950/70 border border-slate-700/80 rounded-xl focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 text-white placeholder-slate-500 text-sm transition">
                        <button type="button" onclick="togglePasswordVisibility()" class="absolute inset-y-0 right-0 flex items-center pr-4 text-slate-500 hover:text-slate-300">
                            <i id="eyeIcon" class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit"
                        class="w-full mt-2 py-3.5 px-4 bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 hover:from-indigo-500 hover:via-purple-500 hover:to-pink-500 text-white font-display font-bold text-sm rounded-xl shadow-xl shadow-indigo-600/30 hover:shadow-indigo-600/50 transition-all duration-200 transform hover:-translate-y-0.5 active:translate-y-0 flex items-center justify-center gap-2">
                    <span>Daxil Ol</span>
                    <i class="fa-solid fa-arrow-right-to-bracket"></i>
                </button>
            </form>

            <div class="mt-6 pt-5 border-t border-slate-800 text-center">
                <p class="text-xs text-slate-400">
                    Hesabınız yoxdur? 
                    <a th:href="@{/register}" class="font-bold text-indigo-400 hover:text-indigo-300 transition underline underline-offset-4">Yeni Hesab Yarat</a>
                </p>
            </div>
        </div>

        <!-- Quick Demo Fill Card -->
        <div class="p-3.5 rounded-2xl bg-slate-900/60 border border-slate-800/80 text-center flex items-center justify-between text-xs text-slate-400">
            <span class="flex items-center gap-2">
                <i class="fa-solid fa-key text-purple-400"></i>
                <span>Sürətli Admin Girişi:</span>
            </span>
            <button type="button" onclick="fillAdminCredentials()" class="px-3 py-1 bg-purple-500/20 hover:bg-purple-500/30 text-purple-300 border border-purple-500/30 rounded-lg text-xs font-bold transition">
                Məlumatı Doldur ⚡
            </button>
        </div>
    </div>

    <script>
        function togglePasswordVisibility() {
            const passInput = document.getElementById('loginPassword');
            const eyeIcon = document.getElementById('eyeIcon');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                passInput.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        }

        function fillAdminCredentials() {
            document.getElementById('loginEmail').value = 'admin@gmail.com';
            document.getElementById('loginPassword').value = 'admin123';
        }
    </script>
</body>
</html>
