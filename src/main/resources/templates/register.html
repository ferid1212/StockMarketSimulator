<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qeydiyyat — Stock System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        display: ['"Outfit"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #070a12;
            background-image: 
                radial-gradient(at 10% 20%, rgba(99, 102, 241, 0.22) 0px, transparent 50%),
                radial-gradient(at 90% 10%, rgba(236, 72, 153, 0.2) 0px, transparent 50%),
                radial-gradient(at 50% 90%, rgba(14, 165, 233, 0.18) 0px, transparent 50%);
            background-attachment: fixed;
            color: #f8fafc;
        }

        .glass-box {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 40px -10px rgba(124, 58, 237, 0.2);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-6">
    <div class="w-full max-w-lg space-y-6">
        
        <!-- Logo & Branding -->
        <div class="text-center">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-3xl bg-gradient-to-tr from-pink-600 via-purple-600 to-indigo-600 p-0.5 shadow-2xl shadow-purple-500/30 mb-4 transform hover:rotate-6 transition duration-300">
                <div class="w-full h-full bg-slate-950/80 rounded-[22px] flex items-center justify-center text-pink-400">
                    <i class="fa-solid fa-user-plus text-2xl"></i>
                </div>
            </div>
            <h1 class="font-display text-3xl font-black tracking-tight bg-gradient-to-r from-pink-400 via-purple-300 to-indigo-400 bg-clip-text text-transparent">Yeni Hesab Yarat</h1>
            <p class="text-slate-400 text-xs sm:text-sm mt-1.5">Stock sistemindən tam istifadə etmək üçün qeydiyyatdan keçin</p>
        </div>

        <!-- Glass Register Box -->
        <div class="glass-box rounded-3xl p-7 sm:p-9">
            
            <div th:if="${errorMessage}" class="mb-5 p-4 rounded-2xl bg-rose-500/15 border border-rose-500/40 text-rose-300 text-xs flex items-center gap-3">
                <i class="fa-solid fa-circle-exclamation text-base text-rose-400 flex-shrink-0"></i>
                <span th:text="${errorMessage}">Xəta baş verdi!</span>
            </div>

            <form th:action="@{/register}" th:object="${registerRequest}" method="post" class="space-y-4">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[11px] font-extrabold uppercase tracking-wider text-slate-400 mb-1.5">Ad *</label>
                        <input type="text" th:field="*{name}" required placeholder="Əli"
                               class="w-full px-4 py-3 bg-slate-950/70 border border-slate-700/80 rounded-xl focus:outline-none focus:border-purple-500 focus:ring-2 focus:ring-purple-500/20 text-white placeholder-slate-500 text-sm transition">
                        <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-rose-400 text-[11px] mt-1"></p>
                    </div>
                    <div>
                        <label class="block text-[11px] font-extrabold uppercase tracking-wider text-slate-400 mb-1.5">Soyad *</label>
                        <input type="text" th:field="*{surname}" required placeholder="Əliyev"
                               class="w-full px-4 py-3 bg-slate-950/70 border border-slate-700/80 rounded-xl focus:outline-none focus:border-purple-500 focus:ring-2 focus:ring-purple-500/20 text-white placeholder-slate-500 text-sm transition">
                        <p th:if="${#fields.hasErrors('surname')}" th:errors="*{surname}" class="text-rose-400 text-[11px] mt-1"></p>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[11px] font-extrabold uppercase tracking-wider text-slate-400 mb-1.5">Yaş *</label>
                        <input type="number" th:field="*{age}" min="18" required placeholder="25"
                               class="w-full px-4 py-3 bg-slate-950/70 border border-slate-700/80 rounded-xl focus:outline-none focus:border-purple-500 focus:ring-2 focus:ring-purple-500/20 text-white placeholder-slate-500 text-sm transition">
                        <p th:if="${#fields.hasErrors('age')}" th:errors="*{age}" class="text-rose-400 text-[11px] mt-1"></p>
                    </div>
                    <div>
                        <label class="block text-[11px] font-extrabold uppercase tracking-wider text-slate-400 mb-1.5">Telefon *</label>
                        <input type="text" th:field="*{phone}" required placeholder="+994501234567"
                               class="w-full px-4 py-3 bg-slate-950/70 border border-slate-700/80 rounded-xl focus:outline-none focus:border-purple-500 focus:ring-2 focus:ring-purple-500/20 text-white placeholder-slate-500 text-sm transition">
                        <p th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" class="text-rose-400 text-[11px] mt-1"></p>
                    </div>
                </div>

                <div>
                    <label class="block text-[11px] font-extrabold uppercase tracking-wider text-slate-400 mb-1.5">Email / Gmail *</label>
                    <input type="email" th:field="*{email}" required placeholder="user@gmail.com"
                           class="w-full px-4 py-3 bg-slate-950/70 border border-slate-700/80 rounded-xl focus:outline-none focus:border-purple-500 focus:ring-2 focus:ring-purple-500/20 text-white placeholder-slate-500 text-sm transition">
                    <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-rose-400 text-[11px] mt-1"></p>
                </div>

                <div>
                    <label class="block text-[11px] font-extrabold uppercase tracking-wider text-slate-400 mb-1.5">Şifrə *</label>
                    <div class="relative">
                        <input type="password" id="regPassword" th:field="*{password}" required placeholder="••••••••"
                               class="w-full px-4 py-3 bg-slate-950/70 border border-slate-700/80 rounded-xl focus:outline-none focus:border-purple-500 focus:ring-2 focus:ring-purple-500/20 text-white placeholder-slate-500 text-sm transition">
                        <button type="button" onclick="toggleRegPassword()" class="absolute inset-y-0 right-0 flex items-center pr-4 text-slate-500 hover:text-slate-300">
                            <i id="regEyeIcon" class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                    <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="text-rose-400 text-[11px] mt-1"></p>
                </div>

                <button type="submit"
                        class="w-full mt-2 py-3.5 px-4 bg-gradient-to-r from-pink-600 via-purple-600 to-indigo-600 hover:from-pink-500 hover:via-purple-500 hover:to-indigo-500 text-white font-display font-bold text-sm rounded-xl shadow-xl shadow-purple-600/30 hover:shadow-purple-600/50 transition-all duration-200 transform hover:-translate-y-0.5 active:translate-y-0 flex items-center justify-center gap-2">
                    <span>Qeydiyyatı Tamamla</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>

            <div class="mt-6 pt-5 border-t border-slate-800 text-center">
                <p class="text-xs text-slate-400">
                    Artıq hesabınız var? 
                    <a th:href="@{/login}" class="font-bold text-purple-400 hover:text-purple-300 transition underline underline-offset-4">Daxil Ol</a>
                </p>
            </div>
        </div>
    </div>

    <script>
        function toggleRegPassword() {
            const passInput = document.getElementById('regPassword');
            const eyeIcon = document.getElementById('regEyeIcon');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                passInput.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        }
    </script>
</body>
</html>
