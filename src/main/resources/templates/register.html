<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qeydiyyat | Stock System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a, #090d16);
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 text-slate-100">
    <div class="w-full max-w-lg">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-indigo-600/20 border border-indigo-500/30 text-indigo-400 mb-4 shadow-lg shadow-indigo-500/10">
                <i class="fa-solid fa-user-plus text-3xl"></i>
            </div>
            <h1 class="text-3xl font-bold tracking-tight bg-gradient-to-r from-indigo-400 via-purple-300 to-pink-400 bg-clip-text text-transparent">Yeni Hesab Yarat</h1>
            <p class="text-slate-400 text-sm mt-1">Stock sistemindən istifadə etmək üçün qeydiyyatdan keçin</p>
        </div>

        <div class="glass-card rounded-2xl p-8 shadow-2xl shadow-black/50">
            <div th:if="${errorMessage}" class="mb-5 p-4 rounded-xl bg-red-500/10 border border-red-500/30 text-red-400 text-sm flex items-center gap-3">
                <i class="fa-solid fa-circle-exclamation text-lg"></i>
                <span th:text="${errorMessage}">Xəta baş verdi</span>
            </div>

            <form th:action="@{/register}" th:object="${registerRequest}" method="post" class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Ad</label>
                        <input type="text" th:field="*{name}" required placeholder="Əli"
                               class="w-full px-4 py-3 bg-slate-900/60 border border-slate-700/60 rounded-xl focus:outline-none focus:border-indigo-500 text-white placeholder-slate-500 text-sm">
                        <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-red-400 text-xs mt-1"></p>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Soyad</label>
                        <input type="text" th:field="*{surname}" required placeholder="Əliyev"
                               class="w-full px-4 py-3 bg-slate-900/60 border border-slate-700/60 rounded-xl focus:outline-none focus:border-indigo-500 text-white placeholder-slate-500 text-sm">
                        <p th:if="${#fields.hasErrors('surname')}" th:errors="*{surname}" class="text-red-400 text-xs mt-1"></p>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Yaş</label>
                        <input type="number" th:field="*{age}" min="18" required placeholder="25"
                               class="w-full px-4 py-3 bg-slate-900/60 border border-slate-700/60 rounded-xl focus:outline-none focus:border-indigo-500 text-white placeholder-slate-500 text-sm">
                        <p th:if="${#fields.hasErrors('age')}" th:errors="*{age}" class="text-red-400 text-xs mt-1"></p>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Telefon</label>
                        <input type="text" th:field="*{phone}" required placeholder="+994501234567"
                               class="w-full px-4 py-3 bg-slate-900/60 border border-slate-700/60 rounded-xl focus:outline-none focus:border-indigo-500 text-white placeholder-slate-500 text-sm">
                        <p th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" class="text-red-400 text-xs mt-1"></p>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Email / Gmail</label>
                    <input type="email" th:field="*{email}" required placeholder="user@gmail.com"
                           class="w-full px-4 py-3 bg-slate-900/60 border border-slate-700/60 rounded-xl focus:outline-none focus:border-indigo-500 text-white placeholder-slate-500 text-sm">
                    <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-red-400 text-xs mt-1"></p>
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Şifrə</label>
                    <input type="password" th:field="*{password}" required placeholder="••••••••"
                           class="w-full px-4 py-3 bg-slate-900/60 border border-slate-700/60 rounded-xl focus:outline-none focus:border-indigo-500 text-white placeholder-slate-500 text-sm">
                    <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="text-red-400 text-xs mt-1"></p>
                </div>

                <button type="submit"
                        class="w-full mt-2 py-3.5 px-4 bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 hover:from-indigo-500 hover:via-purple-500 hover:to-pink-500 text-white font-semibold rounded-xl shadow-lg shadow-indigo-600/30 hover:shadow-indigo-600/50 transition-all duration-200 transform hover:-translate-y-0.5">
                    Qeydiyyatı Tamamla <i class="fa-solid fa-check-double ml-2"></i>
                </button>
            </form>

            <div class="mt-6 pt-6 border-t border-slate-800 text-center">
                <p class="text-sm text-slate-400">
                    Artıq hesabınız var? 
                    <a th:href="@{/login}" class="font-semibold text-indigo-400 hover:text-indigo-300 transition-colors">Daxil Ol</a>
                </p>
            </div>
        </div>
    </div>
</body>
</html>
